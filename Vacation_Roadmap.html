# 🗺️ 4-Day "Vacation & Close" Roadmap
### A low-friction, high-conversion itinerary for Las Terrenas

> **Mission:** Do not make it feel like work. You are on vacation. You will visit these specific zones to enjoy the beaches and food, and simply drop the "Trojan Horse" pitch when paying the bill or ordering a drink.

---

## 🎯 The "Trojan Horse" Connection Strategy

Before you look at the map, you need to know *how* to connect with the owners based on who they are. Las Terrenas is an expat bubble. 

**1. The European Expats (French & Italian Owners)**
* **Targets:** La Terrasse, Chez Sandro, Casa Azul, Le Tre Caravelle, Boulangerie Française, Ristorante La Dolce Vita.
* **The Vibe:** They pride themselves on authenticity and premium quality.
* **How to Connect:** Praise the food first. *"I've been traveling all over, and this is the most authentic [Pizza/Croissant/Seafood] I've had outside of Europe."* Then drop the pitch: *"It's crazy you don't have a premium website to match how high-end this food is. I couldn't find your menu online. I build cinematic sites for hospitality..."*

**2. The Local Legends (Dominican Owners)**
* **Targets:** Restaurant Luis, Donde Valerio, Parada La Manzana, La Yuca Caliente.
* **The Vibe:** High volume, rustic, cash-heavy, massive word-of-mouth. 
* **How to Connect:** Open Google Maps on your phone and show them. *"Your fish is incredible, but tourists sitting in their hotels right now can't find you on Google, and they can't book a table. You are losing American dollars to the tourist traps. We can fix this in 48 hours."*

**3. The Beach Club / Surf Crowd**
* **Targets:** Beluga Beach Club, Eden Beach Club, Afreeka Hostel, One Love Surf Shack.
* **The Vibe:** Highly visual, Instagram-focused, younger crowd.
* **How to Connect:** *"Your Instagram looks amazing, but making people DM you on WhatsApp to reserve a daybed or a board is losing you impulse buyers. We build automated booking engines so people can pay you while you sleep."*

---

## 📅 The 4-Day Geotargeted Itinerary

### Day 1: Pueblo de los Pescadores (The Town Center)
* **Vibe:** Bustling town energy, great for evening strolls and dinners.
* **Morning Coffee/Breakfast:** Walk into **Boulangerie Française**. Buy a coffee and pastry. Pitch the lack of an online pre-order menu.
* **Lunch/Afternoon:** Hang out at **One Love Surf Shack** or **Pizza Playa**. Grab a beer, talk to the bartender/manager.
* **Dinner:** Eat at **La Terrasse** (French) or **Casa Azul Pizzeria** (Italian). High-end dining. Praise the chef/owner, drop the pitch when paying the bill.

### Day 2: Playa Punta Popy (The East Beach)
* **Vibe:** Kitesurfing, lively beach bars, lots of foot traffic.
* **Morning Beach Day:** Base yourself near **Afreeka Beach Hostel**. Grab a smoothie there, mention their events need a digital ticketing system.
* **Lunch:** **Manda Popy** or **Campuno Beach Club**. Sit on a sunbed, order food, mention the lack of automated daybed reservations.
* **Dinner (Italian Night):** **Le Tre Caravelle**, **Ristorante La Dolce Vita**, or **Pizzeria Raffaele**. Pick one, enjoy a great pasta/pizza, drop the European Expat pitch.

### Day 3: Playa Bonita (The West Beach)
* **Vibe:** Upscale, relaxed, stunning sunsets, very French.
* **Afternoon Chill:** Get a daybed at **Beluga Beach Club**. Enjoy the premium vibe. Ask the manager why they don't have a VIP automated booking site for a place this luxurious.
* **Late Afternoon:** Walk down to **Hotel Boutique Casa Grande**. Grab a drink at the bar, ask reception why they don't have a direct website and are paying Booking.com 20%.
* **Dinner:** **El Cayuco de la Bonita** (Spanish Seafood). Eat paella, drop the pitch.

### Day 4: Playa Cosón & Adventure Day
* **Vibe:** Wild, beautiful, famous for rustic seafood and waterfalls.
* **Morning Adventure:** Go to the El Limón Waterfall. Stop by **Parada La Manzana**. Tell them they are losing 30% commission to TripAdvisor guides because they don't have direct digital booking.
* **Late Lunch (The Main Event):** Go to **Restaurant Luis** or **Donde Valerio** right on the sand at Playa Cosón. Eat the famous grilled fish. Show them Google Maps on your phone and explain the digital revenue they are missing.
