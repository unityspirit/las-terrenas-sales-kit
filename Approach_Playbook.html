## 📍 Area Intelligence: Las Terrenas, Samaná

### What It Is
Las Terrenas is a cosmopolitan beach town on the **north coast of the Samaná Peninsula**, Dominican Republic. Unlike Punta Cana (all-inclusive resort machines), Las Terrenas has a **sophisticated European-Caribbean soul** — a strong French, Italian, Swiss, and German expat base, an active entrepreneurial community, and a restaurant scene that punches well above its size.

> [!NOTE]
> **2026 is officially declared the "Year of Samaná"** by the Dominican government — massive infrastructure investment is underway (RD\$2+ billion). This creates urgency: businesses are growing fast and NEED their digital presence to keep up.

### October 4–18 Context
| Factor | Reality |
|--------|---------|
| 🗓️ Season | Low / shoulder season — fewer crowds, relaxed vibe |
| 🌡️ Weather | 87–88°F / 31°C, warm ocean, some tropical showers |
| 💰 Prices | Discounted hotels & restaurants → low operating cost |
| 🤝 Business owners | **More available** — not swamped by peak-season rush |
| 🐋 Whale watching | Not available (January–March season) |
| 🌊 Activities | Beaches, El Limón Waterfall, kitesurfing, snorkeling |

**Strategic advantage**: Low season means business owners have TIME to talk. They're not in survival mode. This is the perfect moment for longer, genuine relationship conversations.

## 🎯 Key Talking Points & Sales Script

### The Opening (No-Pitch Approach)
> *"I'm here on vacation but I work in digital marketing for tourism businesses. I was curious — how do most guests find you? Is it mostly Booking.com / Instagram, or do you have a website as well?"*

This gets them talking about their pain naturally. Never lead with "I sell websites."

### The Pivot (After They Express a Pain)
> *"That's actually something we see a lot — businesses like yours are doing great, but losing a percentage of bookings because there's no direct booking path. We built a system specifically for boutique hotels here in the Caribbean that typically recovers those commissions in the first 60 days."*

### The Close (The Niche Audit Offer)
> *"I'll tell you what — I can run a quick audit of your online presence for free, takes about 20 minutes. You'll see exactly where you're losing visibility and what it would take to fix it. No obligation. Want me to send it to you while I'm still here?"*

## 🇩🇴 Cultural & Practical Tips

| Tip | Detail |
|-----|--------|
| 🗣️ Language | Spanish is essential. French helps a lot (many owners are French). English works with most expats |
| ⏰ Business timing | Morning visits: 9–11am. Dinner conversation: after 8pm. Avoid siesta hours (1–3pm) |
| 🤝 Relationship first | Dominican business culture is relationship-driven. Never rush to the pitch |
| 📱 WhatsApp | This is the primary B2B communication channel — get their WhatsApp, not just email |
| 💵 Pricing | Quote in USD — preferred currency for expat business owners |
| 🌧️ Rain | October has showers — have a backup "indoor meeting" plan (coffee shop, coworking space) |
| 🚗 Transport | Rent a scooter or car — Playa Bonita, El Portillo, and El Limón are spread out |
